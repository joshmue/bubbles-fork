[package]
name = "bubbles"
version = "0.1.0"
edition = "2021"

[lib]
name = "bubbles"
path = "src/lib.rs"

[[bin]]
name = "bubbles"
path = "src/main.rs"

[[bin]]
name = "bubbles-launch"
path = "src/launch.rs"

[dependencies]
libc = "0.2"
relm4 = { version = "0.10.0", features = ["css", "macros", "libadwaita", "gnome_48"] }
tokio = { version = "1.47", features = ["fs", "net", "io-util", "time", "sync"] }
gtk = { version = "0.10", package = "gtk4" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
